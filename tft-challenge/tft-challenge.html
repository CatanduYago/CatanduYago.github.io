<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TFT Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;1,400&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#060914; --navy:#0B1330; --panel:#101A3A; --panel-2:#15214A; --line:#26335F; --line-strong:#3B4C86;
  --text:#E9EDF8; --muted:#A6B1CE; --faint:#7884A8;
  --gold:#E3B95E; --violet:#A285FF; --electric:#4BB6FF;
  --ok:#43DB93; --bad:#FF7484; --skip:#9099B6;
  --accent:var(--gold);
  --font-display:"Chakra Petch","Rajdhani","Segoe UI",system-ui,sans-serif;
  --font-body:"Barlow","Segoe UI",system-ui,-apple-system,sans-serif;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --ease:cubic-bezier(.2,.7,.2,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; } }
:root[data-theme="dark"]{ color-scheme:dark; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--text);
  font-family:var(--font-body); font-size:1.0625rem; line-height:1.55;
  background-image:
    radial-gradient(1100px 500px at 85% -10%, rgba(75,182,255,.10), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(162,133,255,.10), transparent 60%);
  background-attachment:fixed;
  -webkit-text-size-adjust:100%;
}
body[data-accent="violet"]{ --accent:var(--violet); }
body[data-accent="gold"]{ --accent:var(--gold); }
img,svg{ max-width:100%; }
a{ color:var(--electric); }
a:hover{ color:#8fd2ff; }
:focus-visible{ outline:2px solid var(--electric); outline-offset:3px; border-radius:4px; }
.sr{ position:absolute!important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
.shell{ max-width:980px; margin:0 auto; padding:0 clamp(16px,4vw,32px); }
main{ padding:var(--s6) 0 var(--s8); }
h1,h2,h3{ font-family:var(--font-display); line-height:1.15; margin:0; }
p{ margin:0; }

/* Top bar */
.topbar{ border-bottom:1px solid var(--line); background:rgba(6,9,20,.7); }
.topbar .shell{ display:flex; align-items:center; justify-content:space-between; gap:var(--s4); min-height:56px; }
.brand{ white-space:nowrap; display:flex; align-items:center; gap:var(--s2); font-family:var(--font-display); font-weight:700; font-size:1.05rem; color:var(--text); text-decoration:none; background:none; border:0; padding:0; cursor:pointer; }
.brand svg{ width:22px; height:22px; color:var(--gold); }
.topbar small{ color:var(--faint); font-size:.85rem; }

/* Buttons */
.btn{
  --btn-bg:transparent; --btn-fg:var(--text); --btn-bd:var(--line-strong);
  display:inline-flex; align-items:center; justify-content:center; gap:var(--s2);
  min-height:48px; padding:0 var(--s5); border-radius:var(--r-sm);
  border:1px solid var(--btn-bd); background:var(--btn-bg); color:var(--btn-fg);
  font-family:var(--font-display); font-weight:600; font-size:.95rem; letter-spacing:.06em;
  cursor:pointer; text-decoration:none; transition:background .15s, border-color .15s, color .15s, transform .15s var(--ease);
}
.btn svg{ width:18px; height:18px; flex:none; }
.btn:hover{ border-color:var(--accent); }
.btn:active{ transform:translateY(1px); }
.btn[disabled]{ opacity:.4; cursor:not-allowed; }
.btn[disabled]:hover{ border-color:var(--btn-bd); }
.btn-primary{ --btn-bg:var(--accent); --btn-fg:#140F05; --btn-bd:var(--accent); }
.btn-primary:hover{ filter:brightness(1.08); }
.btn-quiet{ --btn-bd:transparent; color:var(--muted); padding:0 var(--s3); min-height:40px; font-size:.85rem; }
.btn-quiet:hover{ color:var(--text); border-color:var(--line); }
.btn-row{ display:flex; flex-wrap:wrap; gap:var(--s3); }

/* Home */
.hero{ padding:var(--s6) 0 var(--s6); }
.hero h1{ font-size:clamp(2.7rem,8vw,4.8rem); font-weight:700; letter-spacing:-.01em; }
.hero h1 .tft{ color:var(--gold); }
.hero h1:focus{ outline:none; }
.tagline{ font-family:var(--font-body); font-style:italic; color:var(--muted); font-size:clamp(1.05rem,2.4vw,1.3rem); margin-top:var(--s2); }
.chips{ display:flex; flex-wrap:wrap; gap:var(--s2); margin-top:var(--s5); }
.chip{ display:inline-flex; align-items:center; gap:6px; padding:4px 12px; border:1px solid var(--line-strong); border-radius:999px; font-size:.88rem; color:var(--muted); background:rgba(16,26,58,.6); }
.chip svg{ width:15px; height:15px; }
.chip-extreme{ border-color:var(--gold); color:var(--gold); font-family:var(--font-display); font-weight:700; letter-spacing:.08em; }
.brief{ max-width:62ch; margin-top:var(--s5); color:var(--text); }
.brief + .btn-row{ margin-top:var(--s4); }

.exams{ display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr)); gap:var(--s5); margin-top:var(--s4); }
.exam-card{
  --card-accent:var(--gold);
  position:relative; display:flex; flex-direction:column; gap:var(--s4);
  padding:var(--s5); border:1px solid var(--line); border-radius:var(--r-lg);
  background:linear-gradient(180deg, rgba(21,33,74,.9), rgba(13,21,48,.9));
  box-shadow:0 18px 40px -24px rgba(0,0,0,.8);
  transition:border-color .2s, transform .2s var(--ease);
}
.exam-card[data-accent="violet"]{ --card-accent:var(--violet); }
.exam-card::before{ content:""; position:absolute; inset:0 0 auto; height:3px; border-radius:var(--r-lg) var(--r-lg) 0 0; background:var(--card-accent); }
.exam-card:hover{ border-color:color-mix(in srgb, var(--card-accent) 60%, var(--line)); transform:translateY(-2px); }
.exam-head{ display:flex; gap:var(--s4); align-items:center; }
.hexmark{ width:58px; height:64px; flex:none; display:grid; place-items:center; font-family:var(--font-display); font-weight:700; font-size:1.35rem; color:#120d04; background:var(--card-accent); clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); }
.exam-card h2{ font-size:1.5rem; }
.exam-card .kicker{ color:var(--card-accent); font-family:var(--font-display); font-weight:600; font-size:.95rem; }
.exam-card p.desc{ color:var(--muted); }
.facts{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:var(--s2) var(--s4); margin:0; padding:var(--s4) 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.facts div{ display:flex; flex-direction:column; }
.facts dt{ color:var(--faint); font-size:.82rem; }
.facts dd{ margin:0; font-weight:600; }
.status{ display:flex; align-items:center; gap:var(--s2); color:var(--muted); font-size:.95rem; }
.status svg{ width:18px; height:18px; color:var(--card-accent); }
.exam-card .btn-primary{ --btn-bg:var(--card-accent); --btn-bd:var(--card-accent); }
.exam-card .btn-row{ margin-top:auto; }
.footnote{ margin-top:var(--s7); color:var(--faint); font-size:.9rem; max-width:70ch; }
.footnote a{ color:var(--muted); }

/* Quiz */
.quiz-head{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:var(--s3) var(--s4); }
.quiz-title{ display:flex; flex-direction:column; gap:2px; }
.quiz-title .exam-name{ font-family:var(--font-display); font-weight:600; color:var(--accent); font-size:.95rem; }
.quiz-title h1{ font-size:clamp(1.4rem,3.6vw,1.9rem); }
.meta-row{ display:flex; flex-wrap:wrap; align-items:center; gap:var(--s2); }
.meta-row .chip{ font-variant-numeric:tabular-nums; }
.progress{ margin-top:var(--s5); }
.bar{ height:6px; border-radius:99px; background:var(--panel-2); overflow:hidden; }
.bar > span{ display:block; height:100%; width:0; background:linear-gradient(90deg,var(--accent),var(--electric)); transition:width .35s var(--ease); }
.hextrack{ display:flex; flex-wrap:wrap; gap:6px; margin-top:var(--s4); list-style:none; padding:0; }
.hexbtn{ width:38px; height:42px; padding:0; border:0; background:transparent; cursor:pointer; position:relative; border-radius:4px; }
.hexbtn .hx{ position:absolute; inset:0; clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); background:var(--line-strong); }
.hexbtn .hx::after{ content:""; position:absolute; inset:2px; clip-path:inherit; background:var(--navy); }
.hexbtn .n{ position:relative; z-index:1; font-family:var(--font-display); font-weight:600; font-size:.85rem; color:var(--muted); font-variant-numeric:tabular-nums; }
.hexbtn.done .hx{ background:var(--accent); }
.hexbtn.done .hx::after{ background:color-mix(in srgb, var(--accent) 22%, var(--navy)); }
.hexbtn.done .n{ color:var(--text); }
.hexbtn.current .hx{ background:var(--electric); }
.hexbtn.current .hx::after{ inset:3px; }
.hexbtn.current .n{ color:var(--electric); }
.hexbtn:hover .hx{ filter:brightness(1.25); }

.qcard{ margin-top:var(--s5); padding:clamp(20px,4vw,36px); border:1px solid var(--line); border-radius:var(--r-lg); background:linear-gradient(180deg, rgba(21,33,74,.85), rgba(12,19,46,.9)); }
.qcard.enter{ animation:enter .32s var(--ease); }
@keyframes enter{ from{ opacity:0; transform:translateX(14px); } to{ opacity:1; transform:none; } }
.qcat{ display:inline-flex; align-items:center; gap:6px; color:var(--faint); font-size:.88rem; }
.qcat svg{ width:15px; height:15px; color:var(--accent); }
.qtext{ font-family:var(--font-body); font-weight:600; font-size:clamp(1.15rem,2.6vw,1.4rem); line-height:1.4; margin-top:var(--s3); max-width:68ch; }
.qtext:focus{ outline:none; }
.qtext:focus-visible{ outline:2px solid var(--electric); outline-offset:6px; }
fieldset{ border:0; margin:var(--s5) 0 0; padding:0; min-width:0; }
.opts{ display:grid; gap:var(--s3); }
.opt{
  display:flex; align-items:flex-start; gap:var(--s4); padding:var(--s4); min-height:60px;
  border:1px solid var(--line); border-radius:var(--r-md); background:rgba(6,9,20,.45);
  cursor:pointer; transition:border-color .15s, background .15s;
}
.opt:hover{ border-color:var(--line-strong); background:rgba(21,33,74,.6); }
.opt:has(input:focus-visible){ outline:2px solid var(--electric); outline-offset:2px; }
.opt .letter{ flex:none; width:34px; height:38px; display:grid; place-items:center; font-family:var(--font-display); font-weight:700; color:var(--muted); background:var(--panel-2); clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); }
.opt .otext{ padding-top:6px; color:var(--muted); }
.opt.is-selected{ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 10%, rgba(6,9,20,.6)); }
.opt.is-selected .letter{ background:var(--accent); color:#140f05; }
.opt.is-selected .otext{ color:var(--text); }
.kbd-hint{ margin-top:var(--s4); color:var(--faint); font-size:.85rem; }
kbd{ font-family:var(--font-display); font-size:.8rem; border:1px solid var(--line-strong); border-bottom-width:2px; border-radius:4px; padding:0 5px; color:var(--muted); }
.qnav{ display:flex; justify-content:space-between; gap:var(--s3); margin-top:var(--s5); }
.qnav .btn{ min-width:140px; }

/* Results */
.result-top{ display:grid; grid-template-columns:auto 1fr; gap:var(--s6); align-items:center; margin-top:var(--s5); padding:clamp(20px,4vw,36px); border:1px solid var(--line); border-radius:var(--r-lg); background:linear-gradient(180deg, rgba(21,33,74,.85), rgba(12,19,46,.9)); }
.ring{ width:180px; height:180px; position:relative; }
.ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
.ring .track{ stroke:var(--panel-2); }
.ring .val{ stroke:var(--accent); transition:stroke-dashoffset 1s var(--ease); }
.ring .center{ position:absolute; inset:0; display:grid; place-content:center; text-align:center; }
.ring .pct{ font-family:var(--font-display); font-weight:700; font-size:2.1rem; }
.ring .pct-l{ color:var(--faint); font-size:.85rem; }
.done-label{ font-family:var(--font-display); font-weight:700; letter-spacing:.08em; color:var(--accent); }
.grade{ font-family:var(--font-display); font-weight:700; font-size:clamp(3.4rem,10vw,5.4rem); line-height:1; margin-top:var(--s2); font-variant-numeric:tabular-nums; }
.grade small{ font-size:.4em; color:var(--faint); font-weight:600; }
.rank{ font-size:1.25rem; font-weight:600; margin-top:var(--s2); }
.rank-note{ color:var(--faint); font-size:.88rem; }
.stats{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:var(--s3); margin-top:var(--s5); }
.stat{ padding:var(--s4); border:1px solid var(--line); border-radius:var(--r-md); background:rgba(6,9,20,.4); }
.stat .k{ display:flex; align-items:center; gap:6px; color:var(--faint); font-size:.88rem; }
.stat .k svg{ width:16px; height:16px; }
.stat .v{ font-family:var(--font-display); font-weight:700; font-size:1.7rem; font-variant-numeric:tabular-nums; }
.stat.ok .k svg{ color:var(--ok); } .stat.bad .k svg{ color:var(--bad); } .stat.skip .k svg{ color:var(--skip); }
.best{ margin-top:var(--s4); color:var(--muted); }
.result-actions{ margin-top:var(--s5); }

/* Review */
.filters{ display:flex; flex-wrap:wrap; gap:var(--s2); margin-top:var(--s5); }
.filter{ min-height:40px; padding:0 var(--s4); border-radius:999px; border:1px solid var(--line-strong); background:transparent; color:var(--muted); font-family:var(--font-body); font-weight:600; font-size:.95rem; cursor:pointer; }
.filter[aria-pressed="true"]{ background:var(--text); color:var(--bg); border-color:var(--text); }
.filter .c{ font-variant-numeric:tabular-nums; opacity:.75; margin-left:4px; }
.rlist{ list-style:none; padding:0; margin:var(--s5) 0 0; display:grid; gap:var(--s4); }
.rcard{ --st:var(--skip); padding:var(--s5); border:1px solid var(--line); border-left:4px solid var(--st); border-radius:var(--r-md); background:rgba(16,26,58,.7); }
.rcard.ok{ --st:var(--ok); } .rcard.bad{ --st:var(--bad); }
.rhead{ display:flex; flex-wrap:wrap; justify-content:space-between; gap:var(--s2); align-items:center; }
.rnum{ font-family:var(--font-display); font-weight:600; color:var(--faint); }
.pill{ display:inline-flex; align-items:center; gap:6px; padding:2px 10px; border-radius:999px; font-weight:600; font-size:.88rem; color:var(--st); border:1px solid color-mix(in srgb, var(--st) 55%, transparent); }
.pill svg{ width:15px; height:15px; }
.rq{ font-weight:600; margin-top:var(--s3); max-width:72ch; }
.ans{ display:grid; gap:var(--s2); margin-top:var(--s4); }
.ans div{ display:grid; grid-template-columns:150px 1fr; gap:var(--s3); }
.ans dt{ color:var(--faint); font-size:.92rem; }
.ans dd{ margin:0; }
.ans .yours.bad{ color:#ffb3bc; text-decoration:line-through; text-decoration-color:rgba(255,116,132,.6); }
.ans .right{ color:#a7f0cb; }
.expl{ margin-top:var(--s4); padding-top:var(--s4); border-top:1px dashed var(--line); color:var(--muted); max-width:75ch; }
.src{ margin-top:var(--s3); font-size:.9rem; color:var(--faint); }
.src a{ color:var(--muted); }
.empty{ margin-top:var(--s5); color:var(--muted); }

/* Dialog */
dialog{ width:min(520px, calc(100vw - 32px)); padding:0; border:1px solid var(--line-strong); border-radius:var(--r-lg); background:var(--panel); color:var(--text); box-shadow:0 30px 80px -20px rgba(0,0,0,.9); }
dialog::backdrop{ background:rgba(3,5,12,.72); }
.dlg{ padding:var(--s5); }
.dlg h2{ font-size:1.35rem; }
.dlg .body{ margin-top:var(--s3); color:var(--muted); }
.dlg .body ul{ padding-left:1.2em; margin:var(--s2) 0 0; }
.dlg .body li + li{ margin-top:6px; }
.dlg .btn-row{ justify-content:flex-end; margin-top:var(--s5); }

/* Tests */
.tests{ list-style:none; padding:0; margin:var(--s5) 0 0; display:grid; gap:var(--s2); }
.tests li{ display:flex; gap:var(--s3); padding:var(--s3) var(--s4); border:1px solid var(--line); border-radius:var(--r-sm); background:rgba(16,26,58,.6); }
.tests li svg{ width:18px; height:18px; flex:none; margin-top:3px; }
.tests li.pass svg{ color:var(--ok); } .tests li.fail svg{ color:var(--bad); }
.tests .d{ color:var(--faint); font-size:.9rem; }
.test-sum{ margin-top:var(--s4); font-family:var(--font-display); font-weight:600; font-size:1.2rem; }

.back{ margin-bottom:var(--s3); }
.view-title{ font-size:clamp(1.6rem,4vw,2.3rem); }
.view-title:focus{ outline:none; }
.view-title:focus-visible{ outline:2px solid var(--electric); outline-offset:6px; }
.lead{ color:var(--muted); margin-top:var(--s2); }

@media (max-width:640px){
  body{ font-size:1rem; }
  .facts{ grid-template-columns:1fr 1fr; }
  .hextrack > li{ flex:0 0 calc((100% - 54px) / 10); }
  .hexbtn{ width:100%; height:34px; }
  .topbar small{ display:none; }
  .hexbtn .n{ font-size:.72rem; }
  .qnav .btn{ min-width:0; flex:1; }
  .result-top{ grid-template-columns:1fr; justify-items:center; text-align:center; }
  .stats{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  .ans div{ grid-template-columns:1fr; gap:0; }
  .result-actions .btn{ flex:1 1 100%; }
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation:none!important; transition:none!important; scroll-behavior:auto!important; }
}
</style>
</head>
<body data-accent="gold">
<header class="topbar">
  <div class="shell">
    <button class="brand" type="button" data-action="home" aria-label="TFT Challenge, volver al inicio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 2 21 7v10l-9 5-9-5V7z"/><path d="m12 7 4.5 2.5v5L12 17l-4.5-2.5v-5z"/></svg>
      TFT Challenge
    </button>
    <small>Set 18, Enchanted Wilds, parche 18.5</small>
  </div>
</header>
<main id="app" class="shell" tabindex="-1"></main>
<div id="live" class="sr" aria-live="polite"></div>
<dialog id="dlg" aria-labelledby="dlg-title"><div class="dlg"><h2 id="dlg-title"></h2><div class="body" id="dlg-body"></div><div class="btn-row" id="dlg-actions"></div></div></dialog>

<script>
'use strict';
/* =========================================================================
   DATOS — quiz-data
   Respuestas verificadas el 23/10/2026. correctAnswer = índice 0–3.
   ========================================================================= */
const SOURCES = {
  patch: { label: 'Riot Games, notas oficiales del parche 18.5 de TFT (20/10/2026, con la actualización del 22/10)', url: 'https://teamfighttactics.leagueoflegends.com/en-us/news/game-updates/teamfight-tactics-patch-18-5/' },
  items: { label: 'Mobalytics, objetos combinados del Set 18 (consultado el 23/10/2026)', url: 'https://mobalytics.gg/tft/items/combined' },
  eclipse: { label: 'League of Legends Wiki, TFT: Eclipse', url: 'https://wiki.leagueoflegends.com/en-us/TFT:Eclipse' },
  origins: { label: 'Total Apex Entertainment, orígenes del Set 18 (Avatar y Apex Predator)', url: 'https://www.yardbarker.com/entertainment/articles/teamfight_tactics_set_18_enchanted_wilds_all_origins/s1_17456_44206995' },
  luxVariants: { label: 'Mobalytics, variantes de Lux por origen', url: 'https://mobalytics.gg/tft/items/combined' },
  data: { label: 'TFTraits, habilidades y rasgos del Set 18 extraídos de los archivos del juego', url: 'https://tftraits.com/set18/' },
  patch183: { label: 'Riot Games, notas oficiales del parche 18.3 de TFT', url: 'https://teamfighttactics.leagueoflegends.com/en-us/news/game-updates/teamfight-tactics-patch-18-3/' }
};
const L = { A: 0, B: 1, C: 2, D: 3 };
function q(id, category, question, options, letter, explanation, sources) {
  return { id, category, question, options, correctAnswer: L[letter], explanation, patch: '18.5', sources: sources.map(k => SOURCES[k]) };
}

const EXAM_ITEMS = {
  id: 'interacciones', numeral: 'I', accent: 'gold',
  title: 'Interacciones', subtitle: 'Campeones, objetos y sinergias',
  description: 'Cómo reacciona cada habilidad a un objeto concreto, qué pasa cuando dos campeones se cruzan y qué potenciadores alfa cambian una partida.',
  set: 'Set 18, Enchanted Wilds', patch: '18.5', estimatedMinutes: 25,

const RANKS = [
  { min: 9.5, label: 'Conocimiento excepcional' },
  { min: 8.5, label: 'Maestro del meta' },
  { min: 7, label: 'Experto' },
  { min: 5, label: 'Jugador experimentado' },
  { min: 2.5, label: 'Conocimientos básicos' },
  { min: 0, label: 'Principiante' }
];
const LETTERS = ['A', 'B', 'C', 'D'];

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rng) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function range(n) { return Array.from({ length: n }, (_, i) => i); }

const QuizService = {
  createSession(exam, rng = Math.random, override) {
    const r = Object.assign({}, exam.randomize, override || {});
    const n = exam.questions.length;
    const optionOrders = {};
    exam.questions.forEach(qq => { optionOrders[qq.id] = r.options ? shuffled(range(qq.options.length), rng) : range(qq.options.length); });
    return {
      v: 1, examId: exam.id, ids: exam.questions.map(qq => qq.id),
      order: r.questions ? shuffled(range(n), rng) : range(n),
      optionOrders, answers: {}, current: 0, elapsedMs: 0, status: 'progress', result: null
    };
  },
  isValid(exam, s) {
    return !!s && s.v === 1 && s.examId === exam.id && Array.isArray(s.ids) && s.ids.join('|') === exam.questions.map(qq => qq.id).join('|') && Array.isArray(s.order) && s.order.length === exam.questions.length;
  },
  total(exam) { return exam.questions.length; },
  questionAt(exam, s, i) { return exam.questions[s.order[i]]; },
  currentQuestion(exam, s) { return this.questionAt(exam, s, s.current); },
  isAnswered(s, qid) { return Object.prototype.hasOwnProperty.call(s.answers, qid); },
  select(exam, s, displayIdx) {
    if (s.status !== 'progress') return false;
    const qq = this.currentQuestion(exam, s);
    const original = s.optionOrders[qq.id][displayIdx];
    if (original === undefined) return false;
    s.answers[qq.id] = original;
    return true;
  },
  selectedDisplayIndex(exam, s, i) {
    const qq = this.questionAt(exam, s, i);
    if (!this.isAnswered(s, qq.id)) return -1;
    return s.optionOrders[qq.id].indexOf(s.answers[qq.id]);
  },
  canAdvance(exam, s) { return this.isAnswered(s, this.currentQuestion(exam, s).id) && s.current < exam.questions.length - 1; },
  next(exam, s) { if (!this.canAdvance(exam, s)) return false; s.current++; return true; },
  prev(s) { if (s.current <= 0) return false; s.current--; return true; },
  goTo(exam, s, i) { if (i < 0 || i >= exam.questions.length) return false; s.current = i; return true; },
  isLast(exam, s) { return s.current === exam.questions.length - 1; },
  answeredCount(exam, s) { return exam.questions.filter(qq => this.isAnswered(s, qq.id)).length; },
  unansweredNumbers(exam, s) {
    const out = [];
    s.order.forEach((qi, pos) => { if (!this.isAnswered(s, exam.questions[qi].id)) out.push(pos + 1); });
    return out;
  },
  score(exam, answers) {
    let correct = 0, wrong = 0, blank = 0;
    exam.questions.forEach(qq => {
      if (!Object.prototype.hasOwnProperty.call(answers, qq.id)) blank++;
      else if (answers[qq.id] === qq.correctAnswer) correct++;
      else wrong++;
    });
    const total = exam.questions.length;
    return { correct, wrong, blank, total, pct: correct / total * 100, grade: correct / total * 10 };
  },
  classify(grade) { return RANKS.find(r => grade >= r.min - 1e-9).label; },
  formatNumber(n) {
    const r = Math.round(n * 10) / 10;
    return Number.isInteger(r) ? String(r) : r.toFixed(1).replace('.', ',');
  },
  submit(exam, s) {
    const sc = this.score(exam, s.answers);
    s.status = 'done';
    s.result = Object.assign({}, sc, { rank: this.classify(sc.grade), elapsedMs: s.elapsedMs, finishedAt: Date.now() });
    return s.result;
  },
  statusOf(qq, answers) {
    if (!Object.prototype.hasOwnProperty.call(answers, qq.id)) return 'skip';
    return answers[qq.id] === qq.correctAnswer ? 'ok' : 'bad';
  }
};

function makeStore(backend) {
  const P = 'tftc:v1:';
  return {
    get(k) { try { const v = backend.getItem(P + k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
    set(k, v) { try { backend.setItem(P + k, JSON.stringify(v)); } catch (e) { /* almacenamiento no disponible */ } },
    del(k) { try { backend.removeItem(P + k); } catch (e) { /* almacenamiento no disponible */ } }
  };
}
function memoryBackend() { const m = new Map(); return { getItem: k => (m.has(k) ? m.get(k) : null), setItem: (k, v) => m.set(k, String(v)), removeItem: k => m.delete(k) }; }
let storageBackend;
try { localStorage.setItem('tftc:probe', '1'); localStorage.removeItem('tftc:probe'); storageBackend = localStorage; } catch (e) { storageBackend = memoryBackend(); }
const Store = makeStore(storageBackend);

const Progress = {
  load(exam, store = Store) { const s = store.get('session:' + exam.id); return QuizService.isValid(exam, s) ? s : null; },
  save(s, store = Store) { store.set('session:' + s.examId, s); },
  clear(examId, store = Store) { store.del('session:' + examId); },
  best(examId, store = Store) { return store.get('best:' + examId); },
  recordBest(examId, result, store = Store) {
    const prev = store.get('best:' + examId);
    if (!prev || result.grade > prev.grade) store.set('best:' + examId, { grade: result.grade, correct: result.correct, at: result.finishedAt });
    return prev;
  }
};

/* ---------- Temporizador ---------- */
function startTimer() {
  stopTimer();
  state.lastTick = performance.now();
  state.timer = setInterval(tick, 1000);
}
function tick() {
  if (!state.session || state.session.status !== 'progress') return;
  const now = performance.now();
  state.session.elapsedMs += now - state.lastTick;
  state.lastTick = now;
  const el = document.getElementById('timer');
  if (el) el.textContent = fmtTime(state.session.elapsedMs);
  Progress.save(state.session);
}
function stopTimer() {
  if (state.timer) { tick(); clearInterval(state.timer); state.timer = null; }
}

  if (state.view !== 'quiz') return;
  if (document.hidden) stopTimer(); else startTimer();
});

    document.getElementById('dlg-title').textContent = title;
    document.getElementById('dlg-body').innerHTML = body;
    const box = document.getElementById('dlg-actions');
    box.innerHTML = '';
    actions.forEach((a, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn ' + (a.primary ? 'btn-primary' : '');
      b.textContent = a.label;
      b.addEventListener('click', () => { dlg.close(); resolve(a.value); });
      box.appendChild(b);
      if (a.autofocus) setTimeout(() => b.focus(), 0);
    });
    const onCancel = () => { dlg.removeEventListener('cancel', onCancel); resolve(null); };
    dlg.addEventListener('cancel', onCancel, { once: true });

  });
}

    '<div class="qnav">' +
      '<button class="btn" type="button" data-action="prev" id="btn-prev">' + icon('left') + 'ANTERIOR</button>' +
      '<button class="btn btn-primary" type="button" data-action="next" id="btn-next"></button>' +
    '</div>';
  const track = document.getElementById('hextrack');
  track.innerHTML = range(total).map(i => '<li><button type="button" class="hexbtn" data-action="jump" data-i="' + i + '"><span class="hx"></span><span class="n">' + (i + 1) + '</span></button></li>').join('');
  renderQuestion(false);
  startTimer();
  document.title = 'Pregunta ' + (s.current + 1) + ' · TFT Challenge';
}
function renderQuestion(animate) {
  const exam = getExam(state.examId);
  const s = state.session;
  const qq = QuizService.currentQuestion(exam, s);
  const sel = QuizService.selectedDisplayIndex(exam, s, s.current);
  const order = s.optionOrders[qq.id];
  const card = document.getElementById('qcard');
  card.innerHTML =
    '<p class="qcat">' + icon('hex') + 'Categoría: ' + esc(qq.category) + '</p>' +
    '<h2 class="qtext" id="qtext" tabindex="-1">' + esc(qq.question) + '</h2>' +
    '<fieldset><legend class="sr">Elige una respuesta</legend><div class="opts">' +
      order.map((orig, d) => {
        const id = 'opt-' + qq.id + '-' + d;
        return '<label class="opt' + (d === sel ? ' is-selected' : '') + '" for="' + id + '">' +
          '<input class="sr" type="radio" name="answer" id="' + id + '" value="' + d + '"' + (d === sel ? ' checked' : '') + '>' +
          '<span class="letter" aria-hidden="true">' + LETTERS[d] + '</span>' +
          '<span class="otext"><span class="sr">Opción ' + LETTERS[d] + ': </span>' + esc(qq.options[orig]) + '</span></label>';
      }).join('') +
    '</div></fieldset>' +
    '<p class="kbd-hint">Atajos: <kbd>A</kbd>–<kbd>D</kbd> o <kbd>1</kbd>–<kbd>4</kbd> para elegir.</p>';
  if (animate) { card.classList.remove('enter'); void card.offsetWidth; card.classList.add('enter'); }
  card.querySelectorAll('input[name="answer"]').forEach(inp => inp.addEventListener('change', () => choose(Number(inp.value), false)));
  updateQuizChrome();
}
function updateQuizChrome() {
  const exam = getExam(state.examId);
  const s = state.session;
  const total = QuizService.total(exam);
  const answered = QuizService.answeredCount(exam, s);
  document.getElementById('qcount').textContent = 'Pregunta ' + (s.current + 1) + ' de ' + total;
  document.querySelector('#answered span').textContent = 'Respondidas: ' + answered + '/' + total;
  const bar = document.getElementById('bar');
  bar.setAttribute('aria-valuenow', String(answered));
  bar.firstElementChild.style.width = (answered / total * 100) + '%';
  document.querySelectorAll('#hextrack .hexbtn').forEach(b => {
    const i = Number(b.dataset.i);
    const qq = QuizService.questionAt(exam, s, i);
    const done = QuizService.isAnswered(s, qq.id);
    const cur = i === s.current;
    b.classList.toggle('done', done);
    b.classList.toggle('current', cur);
    if (cur) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
    b.setAttribute('aria-label', 'Pregunta ' + (i + 1) + ', ' + (done ? 'respondida' : 'sin responder') + (cur ? ', actual' : ''));
  });
  document.getElementById('btn-prev').disabled = s.current === 0;
  const next = document.getElementById('btn-next');
  if (QuizService.isLast(exam, s)) {
    next.innerHTML = 'FINALIZAR TEST' + icon('flag');
    next.dataset.action = 'finish';
    next.disabled = false;
  } else {
    next.innerHTML = 'SIGUIENTE' + icon('right');
    next.dataset.action = 'next';
    next.disabled = !QuizService.canAdvance(exam, s);
  }
  document.title = 'Pregunta ' + (s.current + 1) + ' · TFT Challenge';
}
function choose(displayIdx, fromKey) {
  const exam = getExam(state.examId);
  const s = state.session;
  if (!QuizService.select(exam, s, displayIdx)) return;
  Progress.save(s);
  document.querySelectorAll('#qcard .opt').forEach((o, d) => {
    o.classList.toggle('is-selected', d === displayIdx);
    const inp = o.querySelector('input');
    inp.checked = d === displayIdx;
    if (fromKey && d === displayIdx) inp.focus();
  });
  updateQuizChrome();
}
function moveTo(fn) {
  const exam = getExam(state.examId);
  const s = state.session;
  if (!fn(exam, s)) return;
  Progress.save(s);
  renderQuestion(true);
  announce('Pregunta ' + (s.current + 1) + ' de ' + QuizService.total(exam));
  document.getElementById('qtext').focus({ preventScroll: true });
  const head = document.querySelector('.quiz-head');
  if (head && head.getBoundingClientRect().top < 0) head.scrollIntoView({ block: 'start' });
}
async function finish() {
  const exam = getExam(state.examId);
  const s = state.session;
  const missing = QuizService.unansweredNumbers(exam, s);
  if (missing.length) {
    const choice = await openDialog({
      title: missing.length === 1 ? 'Queda 1 pregunta sin responder' : 'Quedan ' + missing.length + ' preguntas sin responder',
      body: '<p>Sin responder: ' + missing.join(', ') + '.</p><p style="margin-top:8px">Si entregas ahora, contarán como incorrectas.</p>',
      actions: [{ label: 'Volver al test', value: 'back', autofocus: true }, { label: 'Entregar test', value: 'submit', primary: true }]
    });
    if (choice !== 'submit') {
      if (choice === 'back' && missing.length) moveTo((e, ss) => QuizService.goTo(e, ss, missing[0] - 1));
      return;
    }
  }
  stopTimer();
  const result = QuizService.submit(exam, s);
  const prevBest = Progress.recordBest(exam.id, result);
  s.prevBest = prevBest ? prevBest.grade : null;
  Progress.save(s);
  go('results', exam.id);
}
async function abandon() {
  const choice = await openDialog({
    title: '¿Abandonar el examen?',
    body: '<p>Tus respuestas y el tiempo se guardan. Podrás continuar desde la pantalla de inicio.</p>',
    actions: [{ label: 'Seguir respondiendo', value: false, autofocus: true }, { label: 'Abandonar', value: true, primary: true }]
  });
  if (choice) go('home');
}

/* ---------- Revisión ---------- */
const STATUS_TEXT = { ok: 'Correcta', bad: 'Incorrecta', skip: 'Sin responder' };
const STATUS_ICON = { ok: 'check', bad: 'x', skip: 'minus' };
function renderReview() {
  const exam = getExam(state.examId);

  if (!exam || !s || s.status !== 'done') return go('home');
  const items = s.order.map((qi, pos) => {

    return { qq, pos, st: QuizService.statusOf(qq, s.answers) };
  });

  items.forEach(it => counts[it.st]++);
  const F = [['all', 'Todas'], ['ok', 'Correctas'], ['bad', 'Incorrectas'], ['skip', 'Sin responder']];

    '</div>' +

      const has = st !== 'skip';

      return '<li class="rcard ' + st + '">' +
        '<div class="rhead"><span class="rnum">Pregunta ' + (pos + 1) + '</span><span class="pill">' + icon(STATUS_ICON[st]) + STATUS_TEXT[st] + '</span></div>' +
        '<p class="rq">' + esc(qq.question) + '</p>' +

          '<div><dt>Tu respuesta</dt><dd class="yours ' + st + '">' + yours + '</dd></div>' +
          '<div><dt>Respuesta correcta</dt><dd class="right">' + right + '</dd></div>' +
        '</dl>' +

    }).join('') + '</ol>' : '<p class="empty">No hay preguntas en esta categoría. Prueba con otro filtro.</p>');

/* ---------- Pruebas ---------- */
function runTests() {
  const out = [];
  const t = (name, fn) => { try { const d = fn(); out.push({ name, pass: d === true || d === undefined, detail: typeof d === 'string' ? d : '' }); } catch (e) { out.push({ name, pass: false, detail: e.message }); } };
  const eq = (a, b, m) => { if (a !== b) throw new Error((m || '') + ' esperado ' + JSON.stringify(b) + ', obtenido ' + JSON.stringify(a)); };
  const exam = EXAM_ITEMS;
  const answersWith = (nCorrect, nWrong) => {
    const a = {};
    exam.questions.forEach((qq, i) => {
      if (i < nCorrect) a[qq.id] = qq.correctAnswer;
      else if (i < nCorrect + nWrong) a[qq.id] = (qq.correctAnswer + 1) % 4;
    });
    return a;
  };
  [[20, '10'], [18, '9'], [15, '7,5'], [10, '5'], [0, '0']].forEach(([n, g]) => t('Nota: ' + n + ' aciertos = ' + g + '/10', () => eq(QuizService.formatNumber(QuizService.score(exam, answersWith(n, 20 - n)).grade), g)));
  t('Porcentaje: 15 aciertos = 75 %', () => eq(QuizService.score(exam, answersWith(15, 5)).pct, 75));
  t('Sin responder cuenta como incorrecta y no penaliza de más', () => { const sc = QuizService.score(exam, answersWith(10, 5)); eq(sc.correct, 10); eq(sc.wrong, 5); eq(sc.blank, 5); eq(sc.grade, 5); });
  t('Examen vacío: 0/10 y 20 sin responder', () => { const sc = QuizService.score(exam, {}); eq(sc.grade, 0); eq(sc.blank, 20); });
  [[0, 'Principiante'], [2, 'Principiante'], [2.5, 'Conocimientos básicos'], [4.5, 'Conocimientos básicos'], [5, 'Jugador experimentado'], [6.5, 'Jugador experimentado'], [7, 'Experto'], [8, 'Experto'], [8.5, 'Maestro del meta'], [9, 'Maestro del meta'], [9.5, 'Conocimiento excepcional'], [10, 'Conocimiento excepcional']]
    .forEach(([g, l]) => t('Clasificación ' + QuizService.formatNumber(g) + ' → ' + l, () => eq(QuizService.classify(g), l)));
  const allIds = new Set();
  EXAMS.forEach(ex => {
    t('Datos ' + ex.id + ': 20 preguntas', () => eq(ex.questions.length, 20));
    t('Datos ' + ex.id + ': 4 opciones distintas, índice correcto 0–3, explicación y fuente', () => {
      ex.questions.forEach(qq => {
        if (qq.options.length !== 4) throw new Error(qq.id + ' no tiene 4 opciones');
        if (new Set(qq.options).size !== 4) throw new Error(qq.id + ' repite opciones');
        if (!Number.isInteger(qq.correctAnswer) || qq.correctAnswer < 0 || qq.correctAnswer > 3) throw new Error(qq.id + ' índice correcto inválido');
        if (!qq.explanation || !qq.sources.length || qq.sources.some(s => !s || !s.url)) throw new Error(qq.id + ' sin explicación o fuente');
        if (allIds.has(qq.id)) throw new Error('Identificador repetido: ' + qq.id);
        allIds.add(qq.id);
      });
    });
    t('Datos ' + ex.id + ': respuestas correctas repartidas (5 por letra)', () => {
      const c = [0, 0, 0, 0]; ex.questions.forEach(qq => c[qq.correctAnswer]++);
      eq(c.join('/'), '5/5/5/5');
    });
  });
  t('Navegación: no se puede avanzar sin responder', () => { const s = QuizService.createSession(exam); eq(QuizService.canAdvance(exam, s), false); eq(QuizService.next(exam, s), false); eq(s.current, 0); });
  t('Navegación: ANTERIOR deshabilitado en la primera pregunta', () => { const s = QuizService.createSession(exam); eq(QuizService.prev(s), false); });
  t('Navegación: responder, avanzar y volver conserva la selección', () => {
    const s = QuizService.createSession(exam);
    QuizService.select(exam, s, 2); eq(QuizService.next(exam, s), true); eq(s.current, 1);
    QuizService.select(exam, s, 0); QuizService.prev(s);
    eq(QuizService.selectedDisplayIndex(exam, s, 0), 2); eq(QuizService.selectedDisplayIndex(exam, s, 1), 0);
  });
  t('Navegación: solo una respuesta por pregunta (cambiarla sustituye la anterior)', () => {
    const s = QuizService.createSession(exam); QuizService.select(exam, s, 1); QuizService.select(exam, s, 3);
    eq(Object.keys(s.answers).length, 1); eq(QuizService.selectedDisplayIndex(exam, s, 0), 3);
  });
  t('Navegación: la última pregunta no avanza y permite finalizar', () => {
    const s = QuizService.createSession(exam); QuizService.goTo(exam, s, 19); QuizService.select(exam, s, 0);
    eq(QuizService.isLast(exam, s), true); eq(QuizService.next(exam, s), false);
    eq(QuizService.unansweredNumbers(exam, s).length, 19);
  });
  t('Flujo completo: 20 respuestas correctas → 10/10 y revisión con 20 correctas', () => {
    const s = QuizService.createSession(exam);
    for (let i = 0; i < 20; i++) {
      const qq = QuizService.currentQuestion(exam, s);
      QuizService.select(exam, s, s.optionOrders[qq.id].indexOf(qq.correctAnswer));
      if (i < 19) QuizService.next(exam, s);
    }
    const r = QuizService.submit(exam, s);
    eq(r.grade, 10); eq(exam.questions.filter(qq => QuizService.statusOf(qq, s.answers) === 'ok').length, 20);
    eq(QuizService.select(exam, s, 0), false, 'tras entregar no se puede responder:');
  });
  t('Aleatorización: preguntas y opciones barajadas mantienen la respuesta correcta', () => {
    const s = QuizService.createSession(EXAM_PATCH, mulberry32(42), { questions: true, options: true });
    if (s.order.join(',') === range(20).join(',')) throw new Error('El orden no se ha barajado');
    for (let i = 0; i < 20; i++) {
      QuizService.goTo(EXAM_PATCH, s, i);
      const qq = QuizService.currentQuestion(EXAM_PATCH, s);
      QuizService.select(EXAM_PATCH, s, s.optionOrders[qq.id].indexOf(qq.correctAnswer));
    }
    eq(QuizService.score(EXAM_PATCH, s.answers).correct, 20);
  });
  t('Reinicio: un examen nuevo empieza vacío y no altera el otro examen', () => {
    const mem = makeStore(memoryBackend());
    const a = QuizService.createSession(EXAM_ITEMS); QuizService.select(EXAM_ITEMS, a, 1); Progress.save(a, mem);
    const b = QuizService.createSession(EXAM_PATCH); QuizService.select(EXAM_PATCH, b, 2); QuizService.next(EXAM_PATCH, b); Progress.save(b, mem);
    Progress.save(QuizService.createSession(EXAM_ITEMS), mem);
    const a2 = Progress.load(EXAM_ITEMS, mem), b2 = Progress.load(EXAM_PATCH, mem);
    eq(Object.keys(a2.answers).length, 0); eq(a2.elapsedMs, 0); eq(a2.current, 0);
    eq(Object.keys(b2.answers).length, 1); eq(b2.current, 1);
  });
  t('Persistencia: una sesión guardada con otras preguntas se descarta', () => {
    const mem = makeStore(memoryBackend());
    const s = QuizService.createSession(EXAM_ITEMS); s.ids[0] = 'otra'; Progress.save(s, mem);
    eq(Progress.load(EXAM_ITEMS, mem), null);
  });
  t('Mejor nota: solo se actualiza si se supera', () => {
    const mem = makeStore(memoryBackend());
    Progress.recordBest('x', { grade: 6, correct: 12, finishedAt: 1 }, mem);
    Progress.recordBest('x', { grade: 5, correct: 10, finishedAt: 2 }, mem);
    eq(Progress.best('x', mem).grade, 6);
    Progress.recordBest('x', { grade: 8.5, correct: 17, finishedAt: 3 }, mem);
    eq(Progress.best('x', mem).grade, 8.5);
  });
  return out;
}
function renderTests() {
  setAccent(null);
  const res = runTests();
  const ok = res.filter(r => r.pass).length;
  app.innerHTML =
    '<button class="btn btn-quiet back" type="button" data-action="home">' + icon('left') + 'VOLVER AL INICIO</button>' +
    '<h1 class="view-title" tabindex="-1" data-focus>Pruebas de puntuación y navegación</h1>' +
    '<p class="lead">Se ejecutan en tu navegador sobre la misma lógica que usa el examen, sin tocar tu progreso guardado.</p>' +
    '<p class="test-sum">' + ok + ' de ' + res.length + ' pruebas superadas</p>' +
    '<ul class="tests">' + res.map(r => '<li class="' + (r.pass ? 'pass' : 'fail') + '">' + icon(r.pass ? 'check' : 'x') + '<div><span>' + esc(r.name) + '</span>' + (r.detail ? '<p class="d">' + esc(r.detail) + '</p>' : '') + '<span class="sr">' + (r.pass ? 'Superada' : 'Fallida') + '</span></div></li>').join('') + '</ul>';
  document.title = 'Pruebas · TFT Challenge';
}

/* ---------- Eventos ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const a = el.dataset.action;
  const id = el.dataset.exam;
  switch (a) {
    case 'home':
      if (location.hash) history.replaceState(null, '', location.pathname + location.search);
      if (state.view === 'quiz') { abandon(); return; }
      go('home'); break;
    case 'rules': showRules(); break;
    case 'start': startNew(id); break;
    case 'continue': continueExam(id); break;
    case 'restart-home':
      openDialog({
        title: '¿Empezar de nuevo?',
        body: '<p>Se borrarán las respuestas y el tiempo de este intento. El otro examen no se ve afectado.</p>',
        actions: [{ label: 'Cancelar', value: false, autofocus: true }, { label: 'Empezar de nuevo', value: true, primary: true }]
      }).then(v => { if (v) startNew(id); });
      break;
    case 'results': state.filter = 'all'; go('results', id || state.examId); break;
    case 'review': state.filter = 'all'; go('review', state.examId); break;
    case 'filter': state.filter = el.dataset.f; renderReview(); { const b = app.querySelector('.filter[data-f="' + state.filter + '"]'); if (b) b.focus(); } break;
    case 'prev': moveTo((ex, s) => QuizService.prev(s)); break;
    case 'next': moveTo((ex, s) => QuizService.next(ex, s)); break;
    case 'jump': moveTo((ex, s) => QuizService.goTo(ex, s, Number(el.dataset.i))); break;
    case 'finish': finish(); break;
    case 'abandon': abandon(); break;
  }
});
document.addEventListener('keydown', e => {
  if (state.view !== 'quiz' || dlg.open || e.altKey || e.ctrlKey || e.metaKey) return;
  const k = e.key.toLowerCase();
  const map = { a: 0, b: 1, c: 2, d: 3, '1': 0, '2': 1, '3': 2, '4': 3 };
  if (k in map) { e.preventDefault(); choose(map[k], true); }
});
window.addEventListener('hashchange', () => { if (location.hash === '#pruebas') go('tests'); });

/* ---------- Arranque ---------- */
(function boot() {
  if (location.hash === '#pruebas') { state.view = 'tests'; render(); return; }
  const saved = Store.get('view');
  if (saved && saved.examId && getExam(saved.examId) && ['quiz', 'results', 'review'].includes(saved.view)) {
    const exam = getExam(saved.examId);
    const s = Progress.load(exam);
    if (s && ((saved.view === 'quiz' && s.status === 'progress') || (saved.view !== 'quiz' && s.status === 'done'))) {
      state.view = saved.view; state.examId = saved.examId; state.session = s; setAccent(exam); render(); return;
    }
  }
  state.view = 'home'; render();
})();
</script>
