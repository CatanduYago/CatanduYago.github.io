<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi3D — diseño de piezas para impresión 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#E6EAF2; --muted:#8E98AB; --faint:#5F6A7E;
  --panel:#1D2331; --panel2:#232A3A; --top:#171C27; --line:#2F3749; --line2:#3A4357;
  --field:#141924; --accent:#F2A93B; --accent2:#FFC56B; --accent-ink:#231503;
  --ok:#6FD39B; --warn:#F2C94C; --err:#FF6B7A; --hole:#E25563;
  --x:#F0525F; --y:#5BD27A; --z:#4C8DFF;
  --font:"Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --cond:"Barlow Semi Condensed", "Barlow", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{ /* la app es de modo oscuro por diseño; mantener contraste */ }
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--top);color:var(--ink);font:400 13px/1.4 var(--font);font-variant-numeric:tabular-nums;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{display:grid;grid-template-rows:46px 1fr 26px;grid-template-columns:54px 1fr 312px;height:100%}

/* top bar */
#top{grid-column:1/4;display:flex;align-items:center;gap:4px;padding:0 10px;background:var(--top);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;margin-right:12px;font:600 15px var(--cond);letter-spacing:.2px}
.brand svg{display:block}
.tb{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid transparent;border-radius:6px;background:none;cursor:pointer;color:var(--ink);white-space:nowrap}
.tb:hover{background:var(--panel2);border-color:var(--line)}
.tb:disabled{opacity:.35;cursor:default;background:none;border-color:transparent}
.tb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tb.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
.tb.primary:hover{background:var(--accent2)}
.sep{width:1px;height:22px;background:var(--line);margin:0 6px}
.spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--line);background:var(--panel);cursor:pointer;color:var(--ink)}
.chip b{font-weight:600}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.chip.bad .dot{background:var(--err)}
.units{color:var(--muted);padding:0 6px}
.units b{color:var(--ink);font-weight:600}

/* left tools */
#tools{grid-row:2/4;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:2px;overflow-y:auto;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
.tool{width:40px;height:36px;flex:none;display:grid;place-items:center;border:0;border-radius:7px;background:none;cursor:pointer;color:#C3CBDA;position:relative}
.tool svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.tool:hover{background:var(--panel2);color:var(--ink)}
.tool.on{background:var(--accent);color:var(--accent-ink)}
.tool.hole{color:#F08A95}
.tgap{width:28px;height:1px;background:var(--line);margin:5px 0;flex:none}
#tip{position:fixed;z-index:50;pointer-events:none;background:#0E121A;border:1px solid var(--line2);padding:6px 9px;border-radius:6px;max-width:260px;font-size:12px;opacity:0;transition:opacity .12s}
#tip b{font-weight:600}
#tip kbd{font:600 11px var(--font);border:1px solid var(--line2);border-radius:4px;padding:0 5px;margin-left:6px;color:var(--accent2)}
#tip .d{color:var(--muted);margin-top:2px}

/* viewport */
#vp{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 20%,#30394D 0%,#222938 55%,#1A1F2B 100%)}
#vp canvas{display:block;width:100%;height:100%;touch-action:none}
.ov{position:absolute;z-index:3}
#views{top:10px;right:10px;display:flex;gap:4px}
.vb{height:28px;padding:0 9px;border-radius:6px;border:1px solid var(--line2);background:rgba(23,28,39,.82);cursor:pointer;color:var(--ink);font-size:12px;backdrop-filter:blur(6px)}
.vb:hover{border-color:var(--accent);color:var(--accent2)}
.vb.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#toggles{left:10px;bottom:10px;display:flex;gap:4px;flex-wrap:wrap;max-width:calc(100% - 300px)}
#toggles select{height:28px;border-radius:6px;border:1px solid var(--line2);background:rgba(23,28,39,.82);padding:0 4px}
#ctx{top:10px;left:10px;display:flex;gap:4px;align-items:center}
#ctx .lbl{color:var(--muted);font-size:12px;margin-right:2px}
#banner{top:48px;left:50%;transform:translateX(-50%);min-width:320px;max-width:min(560px,90%);display:none;background:rgba(40,21,26,.95);border:1px solid #6B2E38;border-radius:9px;padding:10px 12px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#banner.show{display:block}
#banner h4{margin:0 0 6px;font:600 14px var(--font);color:#FFB3BC}
#banner .cmp{display:grid;grid-template-columns:auto 1fr 1fr;gap:2px 14px;font-size:12px}
#banner .cmp span:nth-child(3n+1){color:var(--muted)}
#banner .over{color:var(--err);font-weight:600}
#banner .acts{display:flex;gap:6px;margin-top:9px}
#mode{top:10px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:8px;background:rgba(23,28,39,.88);border:1px solid var(--line2);border-radius:9px;padding:4px}
#mode.show{display:flex}
.seg{display:flex;border-radius:6px;overflow:hidden;border:1px solid var(--line2)}
.seg button{border:0;background:none;padding:5px 11px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
#mode input[type=range]{width:110px;accent-color:var(--accent)}
#readout{right:10px;bottom:10px;background:rgba(23,28,39,.92);border:1px solid var(--line2);border-radius:9px;padding:9px 12px;min-width:190px;display:none}
#readout.show{display:block}
#readout .big{font:600 22px var(--font);letter-spacing:.2px}
#readout .big small{font-size:13px;color:var(--muted);font-weight:500;margin-left:3px}
#readout .sub{color:var(--muted);font-size:12px}
#readout .dx{display:flex;gap:10px;font-size:12px;margin-top:3px}
#labels{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.dl{position:absolute;transform:translate(-50%,-50%);background:rgba(16,20,29,.9);border:1px solid var(--line2);color:var(--ink);padding:1px 6px;border-radius:4px;font:600 11.5px var(--font);white-space:nowrap}
.dl.m{border-color:var(--accent);color:var(--accent2)}
.dl.ax{background:none;border:0;font-weight:700;font-size:12px}
#empty{inset:0;display:none;place-items:center;pointer-events:none}
#empty.show{display:grid}
#empty .card{pointer-events:auto;background:rgba(23,28,39,.9);border:1px solid var(--line2);border-radius:12px;padding:20px 22px;max-width:400px}
#empty h3{margin:0 0 4px;font:600 18px var(--font)}
#empty p{margin:0 0 14px;color:var(--muted)}
#empty .row{display:flex;gap:8px;flex-wrap:wrap}
#busy{inset:0;display:none;place-items:center;background:rgba(15,18,26,.45);z-index:20}
#busy.show{display:grid}
#busy div{background:var(--panel);border:1px solid var(--line2);padding:12px 18px;border-radius:9px;display:flex;gap:10px;align-items:center}
#busy i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#busy i{animation-duration:3s}}

/* status */
#status{grid-column:2/4;display:flex;align-items:center;gap:16px;padding:0 12px;background:var(--top);border-top:1px solid var(--line);color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden}
#status b{color:var(--ink);font-weight:500}

/* right panel */
#side{grid-row:2/3;grid-column:3;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
.sec{border-bottom:1px solid var(--line);padding:11px 14px}
.sec h3{margin:0 0 8px;font:600 13px var(--font);color:var(--ink);display:flex;align-items:center;justify-content:space-between}
.sec h3 .h-act{font-weight:500;color:var(--muted);font-size:12px;cursor:pointer;background:none;border:0;padding:0}
.sec h3 .h-act:hover{color:var(--accent2)}
.hint{color:var(--muted);font-size:12px;margin:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld>span{font-size:11.5px;color:var(--muted)}
.num{position:relative;display:flex;align-items:center}
.num input{width:100%;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--field);padding:0 30px 0 8px;text-align:right;font-weight:500}
.num input:focus{border-color:var(--accent);outline:none}
.num i{position:absolute;right:7px;font-style:normal;color:var(--faint);font-size:11px;pointer-events:none}
.num.ax-x input{box-shadow:inset 3px 0 0 var(--x)} .num.ax-y input{box-shadow:inset 3px 0 0 var(--y)} .num.ax-z input{box-shadow:inset 3px 0 0 var(--z)}
.dimrow{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center;margin-bottom:6px}
.dimrow .ax{font:700 13px var(--font);text-align:center}
.dimrow .num input{height:34px;font-size:15px;padding-right:34px}
.txt{width:100%;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--field);padding:0 8px}
textarea.txt{height:70px;padding:6px 8px;resize:vertical}
select.txt{padding:0 6px}
.btn{height:30px;padding:0 10px;border-radius:6px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{background:var(--accent2);color:var(--accent-ink)}
.btn.danger:hover{border-color:var(--err);color:var(--err)}
.btn.full{width:100%}
.btn:disabled{opacity:.4;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:flex;align-items:center;gap:7px;cursor:pointer;color:var(--ink);font-size:12.5px}
.chk input{accent-color:var(--accent)}
.role{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.role button{flex:1;border:0;background:var(--field);padding:6px;cursor:pointer;color:var(--muted)}
.role button.on.s{background:#33405A;color:var(--ink)}
.role button.on.h{background:#5A2A33;color:#FFC2C9}
.tree{display:flex;flex-direction:column;gap:1px;max-height:240px;overflow-y:auto}
.ti{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:5px;cursor:pointer}
.ti:hover{background:var(--panel2)}
.ti.on{background:#3A3322;box-shadow:inset 2px 0 0 var(--accent)}
.ti .sw{width:10px;height:10px;border-radius:3px;flex:none}
.ti .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ti .tg{font-size:11px;color:var(--faint)}
.ti .eye{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 2px;display:grid}
.ti .eye svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6}
.ti.hid .nm{color:var(--faint);text-decoration:line-through}
.grp{margin-top:4px;padding:6px;border:1px dashed var(--line2);border-radius:7px}
.grp .gh{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:3px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){text-align:right}
.ms{display:flex;align-items:center;justify-content:space-between;padding:3px 0;font-size:12.5px}
.ms b{font-weight:600}
.x-btn{border:0;background:none;color:var(--faint);cursor:pointer;font-size:15px;line-height:1}
.x-btn:hover{color:var(--err)}
.note{font-size:12px;padding:7px 9px;border-radius:7px;margin-top:6px}
.note.err{background:rgba(255,107,122,.1);color:#FFB3BC;border:1px solid rgba(255,107,122,.3)}
.note.warn{background:rgba(242,201,76,.08);color:#F5DE9A;border:1px solid rgba(242,201,76,.25)}
.note.ok{background:rgba(111,211,155,.08);color:#B6EBCB;border:1px solid rgba(111,211,155,.25)}

/* modals */
#modal{position:fixed;inset:0;z-index:40;background:rgba(9,11,16,.6);display:none;place-items:center;padding:16px}
#modal.show{display:grid}
.dlg{background:var(--panel);border:1px solid var(--line2);border-radius:12px;width:min(560px,100%);max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.dlg header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg header h2{margin:0;font:600 17px var(--font)}
.dlg .body{padding:14px 18px}
.dlg footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.checks{display:flex;flex-direction:column;gap:3px;margin:6px 0}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:12.5px}
.ck .ic{width:16px;flex:none;font-weight:700;text-align:center}
.ck.ok .ic{color:var(--ok)} .ck.warn .ic{color:var(--warn)} .ck.err .ic{color:var(--err)}
.ready{margin-top:8px;padding:8px 10px;border-radius:7px;font-weight:600;text-align:center}
.ready.ok{background:rgba(111,211,155,.12);color:var(--ok)}
.ready.no{background:rgba(255,107,122,.12);color:var(--err)}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;color:var(--muted);font-weight:500;padding:4px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:5px 6px;border-bottom:1px solid var(--line)}
table.t td.r{text-align:right}
.bigdims{font:600 24px var(--font);margin:2px 0 10px}
.kvbig{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin-bottom:10px}
.kvbig span:nth-child(odd){color:var(--muted)}
.prof{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.pi{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border:1px solid var(--line);border-radius:7px;cursor:pointer}
.pi:hover{border-color:var(--line2)}
.pi.on{border-color:var(--accent);background:rgba(242,169,59,.07)}
.pi small{color:var(--muted)}
#toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tst{background:#0E121A;border:1px solid var(--line2);padding:8px 14px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.tst.err{border-color:#6B2E38;color:#FFC2C9}

@media (max-width:860px){
  #app{grid-template-columns:48px 1fr;grid-template-rows:46px 1fr 260px 24px}
  #side{grid-row:3;grid-column:2}
  #status{grid-row:4}
  #tools{grid-row:2/5}
  .tb span.l{display:none}
  .units{display:none}
  #toggles{max-width:calc(100% - 20px);bottom:auto;top:46px}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2A93B" stroke-width="1.7" stroke-linejoin="round"><path d="M12 2.5 21 7.5v9L12 21.5 3 16.5v-9z"/><path d="M3 7.5 12 12.5 21 7.5M12 12.5v9" stroke="#8E98AB"/></svg>Mi3D</div>
    <button class="tb" id="bNew" data-tip="Nuevo proyecto"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg><span class="l">Nuevo</span></button>
    <button class="tb" id="bOpen" data-tip="Abrir proyecto .mi3d o importar STL" data-k="Ctrl O"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10H3z"/></svg><span class="l">Abrir</span></button>
    <button class="tb" id="bSave" data-tip="Guardar proyecto editable" data-k="Ctrl S"><svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></svg><span class="l">Guardar</span></button>
    <div class="sep"></div>
    <button class="tb" id="bUndo" data-tip="Deshacer" data-k="Ctrl Z"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="tb" id="bRedo" data-tip="Rehacer" data-k="Ctrl Y"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <div class="sep"></div>
    <button class="tb" id="bCheck" data-tip="Comprobar piezas antes de exportar"><svg viewBox="0 0 24 24"><path d="M4 12.5 9 17.5 20 6.5"/></svg><span class="l">Comprobar</span></button>
    <button class="tb primary" id="bExport" data-tip="Exportar STL o 3MF a escala 1:1"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg><span class="l">Exportar</span></button>
    <div class="spacer"></div>
    <span class="units">Unidades: <b>mm</b>, escala <b>1:1</b></span>
    <button class="chip" id="bPrinter" data-tip="Configurar impresora y cama"><span class="dot"></span><b id="prName">Impresora</b><span id="prDims"></span></button>
    <input type="file" id="fileIn" accept=".mi3d,.json,.stl" hidden>
  </header>

  <nav id="tools" aria-label="Herramientas"></nav>

  <main id="vp">
    <div id="labels"></div>
    <div class="ov" id="ctx"></div>
    <div class="ov" id="views">
      <button class="vb" data-view="front" data-tip="Vista frontal (mirando hacia +Y)">Frontal</button>
      <button class="vb" data-view="right" data-tip="Vista lateral derecha">Lateral</button>
      <button class="vb" data-view="top" data-tip="Vista superior">Superior</button>
      <button class="vb" data-view="iso" data-tip="Vista isométrica">Iso</button>
      <button class="vb" data-view="fit" data-tip="Ajustar cámara a la selección o a toda la escena" data-k="F">Ajustar</button>
    </div>
    <div class="ov" id="mode"></div>
    <div class="ov" id="banner"></div>
    <div class="ov" id="toggles"></div>
    <div class="ov" id="readout"></div>
    <div class="ov" id="empty"><div class="card">
      <h3>Empieza una pieza</h3>
      <p>Crea una forma con el panel izquierdo. Todas las medidas están en milímetros y se exportan a escala real.</p>
      <div class="row">
        <button class="btn primary" id="eBox">Caja de 105 × 105 × 20 mm</button>
        <button class="btn" id="eBig">Ejemplo: pieza de 300 × 100 × 50 mm</button>
      </div>
    </div></div>
    <div class="ov" id="busy"><div><i></i><span id="busyTxt">Calculando geometría…</span></div></div>
  </main>

  <aside id="side"></aside>
  <footer id="status"><span id="stCursor">X — Y —</span><span id="stSel"></span><span id="stInfo"></span></footer>
</div>
<div id="modal"></div>
<div id="tip"></div>
<div id="toast"></div>
<script>
/**

/* ===== Núcleo geométrico (unidades: mm, 1 unidad = 1 mm, Z arriba) ===== */
(function (root) {
  const THREE = root.THREE;
  const G = {};

  /* ---------- vector helpers (arrays) ---------- */
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
  const mul = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const len = a => Math.hypot(a[0], a[1], a[2]);
  const norm = a => { const l = len(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
  const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  G.v = { sub, add, mul, dot, cross, len, norm, lerp };

  /* ---------- BSP CSG (derivado de csg.js, Evan Wallace, MIT) — iterativo ---------- */
  const EPS = 1e-5;
  class Plane {
    constructor(n, w) { this.n = n; this.w = w; }
    clone() { return new Plane(this.n.slice(), this.w); }
    flip() { this.n = [-this.n[0], -this.n[1], -this.n[2]]; this.w = -this.w; }
    static fromPoints(a, b, c) {
      const cr = cross(sub(b, a), sub(c, a)); const l = len(cr);
      if (l < 1e-12) return null;
      const n = [cr[0] / l, cr[1] / l, cr[2] / l];
      return new Plane(n, dot(n, a));
    }
    split(poly, cf, cb, f, b) {
      const n = this.n, w = this.w, vs = poly.v;
      let type = 0; const types = new Array(vs.length);
      for (let i = 0; i < vs.length; i++) {
        const t = dot(n, vs[i]) - w;
        const ty = t < -EPS ? 2 : t > EPS ? 1 : 0;
        type |= ty; types[i] = ty;
      }
      if (type === 0) (dot(n, poly.p.n) > 0 ? cf : cb).push(poly);
      else if (type === 1) f.push(poly);
      else if (type === 2) b.push(poly);
      else {
        const fv = [], bv = [];
        for (let i = 0; i < vs.length; i++) {
          const j = (i + 1) % vs.length, ti = types[i], tj = types[j], vi = vs[i], vj = vs[j];
          if (ti !== 2) fv.push(vi);
          if (ti !== 1) bv.push(vi);
          if ((ti | tj) === 3) {
            const t = (w - dot(n, vi)) / dot(n, sub(vj, vi));
            const v = lerp(vi, vj, t); fv.push(v); bv.push(v);
          }
        }
        if (fv.length >= 3) f.push({ v: fv, p: poly.p });
        if (bv.length >= 3) b.push({ v: bv, p: poly.p });
      }
    }
  }
  const flipPoly = p => { const q = p.p.clone(); q.flip(); return { v: p.v.slice().reverse(), p: q }; };

  class Node {

function validateObj(o) {

  else out.push({ l: 'ok', t: 'Escala correcta: 1 unidad = 1 mm' + (scl ? ` (escala del objeto ${o.scale.map(v => (+v.toFixed(4))).join(' × ')} incluida)` : '') });

  else if (!insideBed(bb)) out.push({ l: 'err', t: 'Fuera de los límites de la cama: céntrala y apóyala.' });

  busy(true, 'Comprobando antes de exportar…');
  setTimeout(() => {
    const vals = objs.map(o => ({ o, v: validateObj(o) })); busy(false);
    const all = vals.every(x => x.v.ok);
    const tot = G.bbox(vals.reduce((acc, x) => { const t = worldTris(x.o); const n = new Float64Array(acc.length + t.length); n.set(acc); n.set(t, acc.length); return n; }, new Float64Array(0)));
    const multi = objs.length > 1;
    modal(`<header><h2>Exportar</h2><button class="x-btn" data-close>×</button></header><div class="body">
      <div class="kvbig"><span>Dimensiones</span><span><b>${multi ? 'Conjunto ' : ''}${f2(tot.size[0])} × ${f2(tot.size[1])} × ${f2(tot.size[2])} mm</b></span><span>Unidades</span><span>Milímetros</span><span>Escala</span><span>1:1 (sin escalado al exportar)</span></div>
      <table class="t"><thead><tr><th>Pieza</th><th class="r">X</th><th class="r">Y</th><th class="r">Z</th><th>Estado</th></tr></thead><tbody>
      ${vals.map(x => { const s = x.v.analysis.bbox.size; return `<tr><td>${esc(x.o.name)}</td><td class="r">${f2(s[0])}</td><td class="r">${f2(s[1])}</td><td class="r">${f2(s[2])}</td><td style="color:${x.v.ok ? 'var(--ok)' : 'var(--err)'}">${x.v.ok ? '✓ válida' : '✕ revisar'}</td></tr>`; }).join('')}
      </tbody></table>
      <details style="margin-top:10px"><summary style="cursor:pointer;color:var(--muted)">Ver comprobación detallada</summary>${vals.map(x => `<div style="margin-top:8px"><b>${esc(x.o.name)}</b>${checksHTML(x.v)}</div>`).join('')}</details>
      <div class="grid2" style="margin-top:12px">
        <label class="fld"><span>Formato</span><select class="txt" id="exF"><option value="stl">STL binario</option><option value="3mf">3MF (unidad: milímetro)</option></select></label>
        <label class="fld"><span>Archivos</span><select class="txt" id="exM" ${multi ? '' : 'disabled'}><option value="each">Un archivo por pieza</option><option value="one">Todo en un archivo</option></select></label>
        <label class="fld" style="grid-column:1/3"><span>Nombre base</span><input class="txt" id="exN" value="${esc(safeName(scope.group ? (S.groups.find(g => g.id === scope.group) || {}).name : (multi ? S.name : objs[0].name)))}"></label>
      </div>
      ${inClaude ? '<p class="hint" style="margin-top:8px">En el visor de Claude los archivos se entregan dentro de un .zip. Descomprímelo y abre el STL o 3MF en tu slicer: las medidas se mantienen a escala 1:1.</p>' : ''}
      <div class="ready ${all ? 'ok' : 'no'}">${all ? 'LISTO PARA EXPORTAR' : 'Hay avisos o errores: puedes exportar igualmente, pero revísalos'}</div>
      </div><footer><button class="btn" data-close>Cancelar</button><button class="btn primary" id="exGo">Exportar</button></footer>`);
    $('#exGo').onclick = async () => {
      const fmt = $('#exF').value, mode = multi ? $('#exM').value : 'one', base = safeName($('#exN').value);
      const items = objs.map(o => ({ name: safeName(o.name), tris: exportTris(o) }));
      let files = [];
      if (fmt === 'stl') {
        if (mode === 'each' && multi) files = items.map(it => ({ name: (scope.group ? it.name : it.name) + '.stl', data: G.stl(it.tris, it.name) }));
        else { const t = new Float64Array(items.reduce((s, i) => s + i.tris.length, 0)); let p = 0; items.forEach(i => { t.set(i.tris, p); p += i.tris.length; }); files = [{ name: base + '.stl', data: G.stl(t, base) }]; }
      } else {
        if (mode === 'each' && multi) files = items.map(it => ({ name: it.name + '.3mf', data: G.threeMF([it]) }));
        else files = [{ name: base + '.3mf', data: G.threeMF(items) }];
      }
      closeModal();
      if (files.length === 1) await saveFile(files[0].name, files[0].data);
      else await saveFile(base + '_' + fmt + '.zip', G.zip(files));
    };
  }, 30);
}

/* ================= PROYECTO ================= */
function b64(arr) { const f = new Float32Array(arr), u = new Uint8Array(f.buffer); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); }
function unb64(s) { const bin = atob(s), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new Float64Array(new Float32Array(u.buffer)); }
function serialize() { return JSON.stringify({ ...S, savedAt: new Date().toISOString() }, (k, v) => (v instanceof Float64Array || v instanceof Float32Array) ? { __f32: b64(v) } : v); }
function deserialize(txt) {
  const d = JSON.parse(txt, (k, v) => (v && v.__f32) ? unb64(v.__f32) : v);
  if (d.app !== 'Mi3D') throw new Error('No es un proyecto de Mi3D');
  return Object.assign(freshState(), d);
}
async function saveProject() { const name = safeName(S.name || 'proyecto'); await saveFile(name + '.mi3d.json', serialize()); }
function loadState(ns, msg) { S = ns; UI.sel = []; UI.split = null; buildBed(); H.stack = []; H.idx = -1; commit('Abrir'); fitView(); toast(msg || 'Proyecto abierto'); }
$('#fileIn').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    if (/\.stl$/i.test(f.name)) {
      const t = G.clean(G.parseSTL(await f.arrayBuffer())); const n = normalizeMesh(t);
      const o = addObject('mesh', { name: f.name.replace(/\.stl$/i, ''), mesh: n.tris, pos: n.pos }); UI.sel = [o.id]; commit('Importar STL');
      const s = G.bbox(t).size; toast(`STL importado a 1:1: ${f2(s[0])} × ${f2(s[1])} × ${f2(s[2])} mm`); fitView();
    } else { const ns = deserialize(await f.text()); ns.name = f.name.replace(/\.mi3d(\.json)?$|\.json$/i, ''); loadState(ns); }
  } catch (err) { toast('No se pudo abrir: ' + err.message, 1); }
};
let asT = 0;
function autosave() { clearTimeout(asT); asT = setTimeout(() => { try { localStorage.setItem('mi3d.autosave', serialize()); } catch (e) { } }, 1500); }

/* ================= IMPRESORA ================= */
function loadProfiles() { try { return JSON.parse(localStorage.getItem('mi3d.printers') || '[]'); } catch (e) { return []; } }
function saveProfiles(p) { try { localStorage.setItem('mi3d.printers', JSON.stringify(p)); } catch (e) { } }
function openPrinter() {
  const custom = loadProfiles(); const P = { ...S.printer };
  const list = [...PRESETS.map(p => ({ ...p, preset: 1 })), ...custom];
  modal(`<header><h2>Impresora 3D</h2><button class="x-btn" data-close>×</button></header><div class="body">
    <div class="hint" style="margin-bottom:6px">Perfiles</div><div class="prof">${list.map((p, i) => `<div class="pi ${p.name === S.printer.name && p.w === S.printer.w && p.d === S.printer.d && p.h === S.printer.h ? 'on' : ''}" data-i="${i}"><span>${esc(p.name)} <small>${p.preset ? '' : '(mío)'}</small></span><span><small>${p.w} × ${p.d} × ${p.h} mm</small>${p.preset ? '' : ` <button class="x-btn" data-del="${i}" aria-label="Borrar perfil">×</button>`}</span></div>`).join('')}</div>
    <div class="hint" style="margin-bottom:6px">Cama de impresión</div>
    <label class="fld" style="margin-bottom:8px"><span>Nombre del perfil</span><input class="txt" id="pN" value="${esc(P.name)}"></label>
    <div class="grid3" id="pD"></div>
    <label class="fld" style="margin-top:8px"><span>Pared mínima para la comprobación</span><div id="pW"></div></label>
    </div><footer><button class="btn" id="pSave">Guardar como perfil</button><button class="btn primary" id="pUse">Usar esta impresora</button></footer>`);
  const D = $('#pD');
  ['w', 'd', 'h'].forEach((k, i) => D.append(numField(['Anchura X', 'Profundidad Y', 'Altura Z'][i], P[k], v => { if (v > 0) P[k] = r6(v); }, { cls: 'ax-' + 'xyz'[i] })));
  $('#pW').append(numField('', UI.minWall, v => { if (v > 0) UI.minWall = v; }));
  document.querySelectorAll('.pi').forEach(it => it.onclick = e => {
    if (e.target.dataset.del) { const i = +e.target.dataset.del - PRESETS.length; custom.splice(i, 1); saveProfiles(custom); return openPrinter(); }
    const p = list[+it.dataset.i]; S.printer = { name: p.name, w: p.w, d: p.d, h: p.h }; buildBed(); commit('Impresora'); openPrinter();
  });
  const read = () => { document.activeElement && document.activeElement.blur(); P.name = $('#pN').value.trim() || 'Mi impresora'; };
  $('#pSave').onclick = () => { read(); const i = custom.findIndex(c => c.name === P.name); if (i >= 0) custom[i] = { ...P }; else custom.push({ ...P }); saveProfiles(custom); S.printer = { ...P }; buildBed(); commit('Impresora'); toast('Perfil guardado'); openPrinter(); };
  $('#pUse').onclick = () => { read(); S.printer = { ...P }; buildBed(); commit('Impresora'); closeModal(); };
}

/* ================= modal / toast / tooltip ================= */
function modal(html) { const m = $('#modal'); m.innerHTML = `<div class="dlg" role="dialog" aria-modal="true">${html}</div>`; m.classList.add('show'); m.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal); const f = m.querySelector('input,select,button'); f && f.focus(); }
function closeModal() { $('#modal').classList.remove('show'); $('#modal').innerHTML = ''; }
$('#modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal') closeModal(); });
function toast(t, err) { const d = el(`<div class="tst ${err ? 'err' : ''}">${esc(t)}</div>`); $('#toast').append(d); setTimeout(() => d.remove(), err ? 4200 : 2600); }
const tip = $('#tip');
document.addEventListener('pointerover', e => {
  const t = e.target.closest('[data-tip]'); if (!t) { tip.style.opacity = 0; return; }
  tip.innerHTML = `<b>${esc(t.dataset.tip)}</b>${t.dataset.k ? `<kbd>${t.dataset.k}</kbd>` : ''}${t.dataset.d ? `<div class="d">${esc(t.dataset.d)}</div>` : ''}`;
  const r = t.getBoundingClientRect(); const left = t.closest('#tools');
  tip.style.left = Math.min(window.innerWidth - 270, left ? r.right + 8 : r.left) + 'px';
  tip.style.top = (left ? r.top + 4 : Math.min(window.innerHeight - 60, r.bottom + 6)) + 'px'; tip.style.opacity = 1;
});
document.addEventListener('pointerdown', () => { tip.style.opacity = 0; });

/* ================= cámara y vistas ================= */
let tween = null;
function flyTo(pos, target) { tween = { p0: camera.position.clone(), t0: orbit.target.clone(), p1: pos, t1: target, s: performance.now(), d: matchMedia('(prefers-reduced-motion: reduce)').matches ? 1 : 280 }; }
function sceneBox() {
  const objs = UI.sel.length ? selObjs() : S.objects; const b = boxOfMany(objs);
  if (b.isEmpty()) { const P = S.printer; b.set(new THREE.Vector3(-P.w / 2, -P.d / 2, 0), new THREE.Vector3(P.w / 2, P.d / 2, Math.min(P.h, 60))); }
  return b;
}
function setView(v) {
  if (v === 'fit') return fitView();
  const b = sceneBox(), c = new THREE.Vector3(), s = new THREE.Vector3(); b.getCenter(c); b.getSize(s);
  const r = Math.max(s.length() / 2, 20), dist = r / Math.sin(camera.fov * D2R / 2) * 1.1;
  const dir = { front: [0, -1, 0.0001], right: [1, 0, 0.0001], top: [0, -0.0001, 1], iso: [1, -1, 0.85] }[v];
  flyTo(c.clone().add(new THREE.Vector3(...dir).normalize().multiplyScalar(dist)), c);
}
function fitView() {
  const b = sceneBox(), c = new THREE.Vector3(), s = new THREE.Vector3(); b.getCenter(c); b.getSize(s);
  const r = Math.max(s.length() / 2, 15), dist = r / Math.sin(camera.fov * D2R / 2) * 1.05;
  const dir = camera.position.clone().sub(orbit.target).normalize();
  flyTo(c.clone().add(dir.multiplyScalar(dist)), c);
}
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));

/* mini gizmo de ejes */
const gScene = new THREE.Scene(), gCam = new THREE.OrthographicCamera(-1.6, 1.6, 1.6, -1.6, 0.1, 10);
const gAx = [];
function spriteLabel(txt, col) {
  const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  x.fillStyle = col; x.beginPath(); x.arc(32, 32, 26, 0, 7); x.fill(); x.fillStyle = '#10141C'; x.font = '700 30px Barlow, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(txt, 32, 34);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(c), depthTest: false })); s.scale.set(0.55, 0.55, 1); return s;
}
[['X', '#F0525F', [1, 0, 0], 'right'], ['Y', '#5BD27A', [0, 1, 0], 'back'], ['Z', '#4C8DFF', [0, 0, 1], 'top']].forEach(([n, c, d, v]) => {
  gScene.add(segs([0, 0, 0, d[0] * 0.95, d[1] * 0.95, d[2] * 0.95], new THREE.LineBasicMaterial({ color: c })));
  const s = spriteLabel(n, c); s.position.set(...d.map(x => x * 1.15)); s.userData.view = v; gScene.add(s); gAx.push(s);
});
const GZ = 96;
function gizmoRect() { const r = renderer.domElement.getBoundingClientRect(); return { x: r.width - GZ - 8, y: 46, w: GZ, h: GZ, r }; }
function gizmoClick(ev) {
  const g = gizmoRect(); const x = ev.clientX - g.r.left, y = ev.clientY - g.r.top;
  if (x < g.x || x > g.x + g.w || y < g.y || y > g.y + g.h) return false;
  const m = new THREE.Vector2(((x - g.x) / g.w) * 2 - 1, -((y - g.y) / g.h) * 2 + 1);
  const rc = new THREE.Raycaster(); rc.setFromCamera(m, gCam); const h = rc.intersectObjects(gAx)[0];
  if (h) { const v = h.object.userData.view; setView(v === 'back' ? 'front' : v); }
  return true;
}

/* ================= bucle ================= */
function resize() { const r = vp.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / Math.max(1, r.height); camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(vp);
const tmpV = new THREE.Vector3();
function loop(now) {
  requestAnimationFrame(loop);
  if (tween) { const k = Math.min(1, (now - tween.s) / tween.d), e = 1 - Math.pow(1 - k, 3); camera.position.lerpVectors(tween.p0, tween.p1, e); orbit.target.lerpVectors(tween.t0, tween.t1, e); if (k >= 1) tween = null; }
  orbit.update();
  const dist = camera.position.distanceTo(orbit.target);
  if (gridMinor) gridMinor.material.opacity = Math.max(0, Math.min(0.09, 0.09 * (1 - (dist - 150) / 450)));
  const ms = dist * 0.006; marker.scale.setScalar(ms); markerA.scale.setScalar(ms);
  measG.children.forEach(c => { if (c.userData.scaleWithCam) c.scale.setScalar(Math.max(0.6, dist * 0.004)); });
  renderer.clear(); renderer.render(scene, camera);
  // gizmo
  const g = gizmoRect(); const W = g.r.width, Hh = g.r.height;
  gCam.position.copy(camera.position).sub(orbit.target).normalize().multiplyScalar(4); gCam.up.copy(camera.up); gCam.lookAt(0, 0, 0);
  renderer.setScissorTest(true); renderer.setViewport(g.x, Hh - g.y - g.h, g.w, g.h); renderer.setScissor(g.x, Hh - g.y - g.h, g.w, g.h);
  renderer.clearDepth(); renderer.render(gScene, gCam);
  renderer.setScissorTest(false); renderer.setViewport(0, 0, W, Hh);
  // etiquetas
  for (const L of labels) {
    tmpV.copy(L.p).project(camera);
    const vis = tmpV.z < 1 && Math.abs(tmpV.x) < 1.2 && Math.abs(tmpV.y) < 1.2;
    L.el.style.display = vis && (L.grp !== 'dim' || UI.dims) ? '' : 'none';
    if (vis) { L.el.style.left = ((tmpV.x + 1) / 2 * W) + 'px'; L.el.style.top = ((1 - tmpV.y) / 2 * Hh) + 'px'; }
  }
}

/* ================= teclado ================= */
document.addEventListener('keydown', e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  const ctrl = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (ctrl && k === 's') { e.preventDefault(); saveProject(); return; }
  if (ctrl && k === 'o') { e.preventDefault(); $('#fileIn').click(); return; }
  if (typing) return;
  if (ctrl && k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
  if (ctrl && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); redo(); return; }
  if (ctrl && k === 'd') { e.preventDefault(); dupSel(); return; }
  if (ctrl && k === 'a') { e.preventDefault(); UI.sel = S.objects.filter(o => o.visible !== false).map(o => o.id); syncScene(); renderSide(); updateOverlays(); return; }
  if (ctrl) return;
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); delSel(); return; }
  if (e.key === 'Escape') { if ($('#modal').classList.contains('show')) return closeModal(); if (UI.split) return closeSplit(); M.a = null; hideMarker(); UI.sel = []; UI.face = null; faceG.clear(); if (UI.selMode === 'pickdown') UI.selMode = 'object'; setTool('select'); syncScene(); renderSide(); updateOverlays(); return; }
  const map = { q: 'select', w: 'move', e: 'rotate', r: 'scale', m: 'measure' };
  if (map[k]) { setTool(map[k]); return; }
  if (k === 'f') fitView();
});

/* ================= arranque ================= */
$('#bNew').onclick = () => {
  if (!S.objects.length) return loadState(freshState(), 'Proyecto nuevo');
  modal(`<header><h2>Nuevo proyecto</h2><button class="x-btn" data-close>×</button></header><div class="body"><p>Se cerrará el proyecto actual. Si quieres conservarlo, guárdalo antes.</p></div><footer><button class="btn" data-close>Cancelar</button><button class="btn" id="nSave">Guardar primero</button><button class="btn primary" id="nGo">Empezar proyecto nuevo</button></footer>`);
  $('#nGo').onclick = () => { closeModal(); loadState(freshState(), 'Proyecto nuevo'); };
  $('#nSave').onclick = async () => { closeModal(); await saveProject(); };
};
$('#bOpen').onclick = () => $('#fileIn').click();
$('#bSave').onclick = saveProject;
$('#bUndo').onclick = undo; $('#bRedo').onclick = redo;
$('#bExport').onclick = () => openExport({});
$('#bCheck').onclick = openCheck;
$('#bPrinter').onclick = openPrinter;
$('#eBox').onclick = () => { createPrimitive('box', { params: { w: 105, d: 105, h: 20 } }); fitView(); };
$('#eBig').onclick = () => { createPrimitive('box', { name: 'Soporte', params: { w: 300, d: 100, h: 50 } }); fitView(); };

buildTools(); buildToggles(); buildBed(); buildAxes(); applyToggles();
let restored = false;
try { const s = localStorage.getItem('mi3d.autosave'); if (s) { S = deserialize(s); restored = S.objects.length > 0; } } catch (e) { }
buildBed();
H.stack = [snap()]; H.idx = 0;
setTool('select'); afterChange(); resize();
if (restored) { toast('Se ha recuperado tu último proyecto'); setTimeout(fitView, 50); }
requestAnimationFrame(loop);
window.__mi3d = { S: () => S, G };
})();
